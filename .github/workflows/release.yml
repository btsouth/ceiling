name: Signed Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build, sign, and draft release
    runs-on: windows-latest
    timeout-minutes: 120
    environment: release

    steps:
      - name: Check out release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release paths
        shell: pwsh
        run: |
          $workRoot = Join-Path $env:RUNNER_TEMP "Ceiling-release"
          $releaseBinDir = Join-Path $workRoot "cache\cargo-target\x86_64-pc-windows-msvc\release"
          $assetsDir = Join-Path $workRoot "assets"
          "RELEASE_WORK_ROOT=$workRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_BIN_DIR=$releaseBinDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_ASSETS_DIR=$assetsDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate tag and version
        shell: pwsh
        run: |
          $line = Get-Content rust\Cargo.toml |
            Where-Object { $_ -match '^version = "([^"]+)"' } |
            Select-Object -First 1
          if (-not $line -or $line -notmatch '^version = "([^"]+)"') {
            throw "Could not read the release version from rust/Cargo.toml."
          }
          $version = $Matches[1]
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match repository version $expectedTag."
          }
          $marketingLine = Get-Content version.env |
            Where-Object { $_ -match '^MARKETING_VERSION=(.+)$' } |
            Select-Object -First 1
          if (-not $marketingLine -or $marketingLine -notmatch '^MARKETING_VERSION=(.+)$') {
            throw "Could not read MARKETING_VERSION from version.env."
          }
          $marketingVersion = $Matches[1].Trim()
          if ($marketingVersion -ne $version) {
            throw "version.env version $marketingVersion does not match repository version $version."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit on protected main."
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.18.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          # The release builder uses its own WorkRoot pnpm store. Enabling the
          # setup-node cache here points at an unused store and fails in cleanup.

      - name: Check Tauri package versions
        shell: pwsh
        run: node scripts/ci/check-tauri-version-sync.mjs

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Compute release cache key
        id: cachekey
        shell: pwsh
        run: |
          # Bump RELEASE_CACHE_VERSION to force a clean, no-cache rebuild without
          # deleting caches by hand (see docs/RELEASING.md).
          $cacheVersion = "v1"
          $rustDescription = (rustc --version --verbose | Out-String)
          $sha = [System.Security.Cryptography.SHA256]::Create().ComputeHash(
            [System.Text.Encoding]::UTF8.GetBytes($rustDescription))
          $rustHash = ([System.BitConverter]::ToString($sha) -replace '-', '').Substring(0, 16).ToLower()
          "cache_version=$cacheVersion" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "rust_hash=$rustHash" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Rust toolchain hash: $rustHash (cache version $cacheVersion)"

      # Restore the release-mode Cargo/pnpm caches warmed on main by
      # warm-release-cache.yml. Caches are ref-scoped, so a tag run cannot read
      # another tag's cache — but it CAN read the default-branch scope this
      # restores from. A miss falls back to a full cold build (the prior
      # behavior), so caching can only make the release faster, never break it.
      # This tag run only restores; it never writes a cache (warming is done on
      # main), so no signed binary or release asset is ever cached here.
      - name: Restore release build caches
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/Ceiling-release/cache/cargo-target
            ${{ runner.temp }}/Ceiling-release/cache/cargo-target-cli
            ${{ runner.temp }}/Ceiling-release/cache/pnpm-store
          key: release-${{ steps.cachekey.outputs.cache_version }}-${{ runner.os }}-msvc-${{ steps.cachekey.outputs.rust_hash }}-${{ hashFiles('Cargo.lock', 'apps/desktop-tauri/pnpm-lock.yaml') }}
          restore-keys: |
            release-${{ steps.cachekey.outputs.cache_version }}-${{ runner.os }}-msvc-${{ steps.cachekey.outputs.rust_hash }}-
            release-${{ steps.cachekey.outputs.cache_version }}-${{ runner.os }}-msvc-

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          if (-not ($candidates | Where-Object { Test-Path -LiteralPath $_ })) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install Inno Setup."
            }
          }

      - name: Build unsigned application binaries
        shell: pwsh
        run: |
          & .\scripts\windows-release-build.ps1 `
            -Ref $env:GITHUB_SHA `
            -RepoUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git" `
            -WorkRoot $env:RELEASE_WORK_ROOT `
            -BuildOnly

      - name: Report release cache status
        if: always()
        shell: pwsh
        run: |
          $hit = "${{ steps.cache-restore.outputs.cache-hit }}"
          $matched = "${{ steps.cache-restore.outputs.cache-matched-key }}"
          if ($hit -eq 'true') {
            $status = "warm (exact cache hit)"
          } elseif ($matched) {
            $status = "partial (prefix restore of $matched)"
          } else {
            $status = "cold (no usable cache)"
          }
          "### Release build cache: $status" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Per-phase timing is the step durations in this run (Build / Sign / Package / Smoke / Doctor)." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign application binaries
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ env.RELEASE_BIN_DIR }}\ceiling.exe
            ${{ env.RELEASE_BIN_DIR }}\codexbar-cli.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package signed application binaries
        shell: pwsh
        run: |
          & .\scripts\windows-release-build.ps1 `
            -Ref $env:GITHUB_SHA `
            -RepoUrl "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git" `
            -WorkRoot $env:RELEASE_WORK_ROOT `
            -PackageOnly

      - name: Sign installers
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ env.RELEASE_ASSETS_DIR }}\Ceiling-${{ env.RELEASE_VERSION }}-Setup.exe
            ${{ env.RELEASE_ASSETS_DIR }}\Ceiling-${{ env.RELEASE_VERSION }}-Store-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures and generate hashes
        shell: pwsh
        run: |
          & .\scripts\finalize-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -WorkRoot $env:RELEASE_WORK_ROOT `
            -ExpectedSigner "CN=Brandon South"

      - name: Smoke-test signed installer
        shell: pwsh
        run: |
          & .\scripts\windows-smoke-install.ps1 `
            -InstallerPath "$env:RELEASE_ASSETS_DIR\Ceiling-$env:RELEASE_VERSION-Setup.exe" `
            -ExpectedVersion $env:RELEASE_VERSION `
            -RequireValidSignature `
            -ExpectedSigner "CN=Brandon South"

      - name: Run release doctor
        shell: pwsh
        run: |
          & .\scripts\release-doctor.ps1 `
            -Version $env:RELEASE_VERSION `
            -AssetsDir $env:RELEASE_ASSETS_DIR `
            -ExpectedSigner "CN=Brandon South" `
            -SkipGitHub

      - name: Upload signed workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ceiling-${{ env.RELEASE_VERSION }}-windows-signed
          path: |
            ${{ env.RELEASE_ASSETS_DIR }}\Ceiling-${{ env.RELEASE_VERSION }}-Setup.exe
            ${{ env.RELEASE_ASSETS_DIR }}\Ceiling-${{ env.RELEASE_VERSION }}-Setup.exe.sha256
            ${{ env.RELEASE_ASSETS_DIR }}\Ceiling-${{ env.RELEASE_VERSION }}-Store-Setup.exe
            ${{ env.RELEASE_ASSETS_DIR }}\Ceiling-${{ env.RELEASE_VERSION }}-Store-Setup.exe.sha256
            ${{ env.RELEASE_ASSETS_DIR }}\Ceiling-${{ env.RELEASE_VERSION }}-portable.exe
            ${{ env.RELEASE_ASSETS_DIR }}\Ceiling-${{ env.RELEASE_VERSION }}-portable.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Create or update draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "$env:RELEASE_ASSETS_DIR\Ceiling-$env:RELEASE_VERSION-Setup.exe",
            "$env:RELEASE_ASSETS_DIR\Ceiling-$env:RELEASE_VERSION-Setup.exe.sha256",
            "$env:RELEASE_ASSETS_DIR\Ceiling-$env:RELEASE_VERSION-Store-Setup.exe",
            "$env:RELEASE_ASSETS_DIR\Ceiling-$env:RELEASE_VERSION-Store-Setup.exe.sha256",
            "$env:RELEASE_ASSETS_DIR\Ceiling-$env:RELEASE_VERSION-portable.exe",
            "$env:RELEASE_ASSETS_DIR\Ceiling-$env:RELEASE_VERSION-portable.exe.sha256"
          )
          $releaseJson = gh release view $tag --json isDraft --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Refusing to replace assets on published release $tag."
            }
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets `
              --verify-tag `
              --draft `
              --generate-notes `
              --title "Ceiling $env:RELEASE_VERSION" `
              --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create or update the draft GitHub release."
          }

      - name: Publish Microsoft Store installer to Cloudflare R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
        run: |
          foreach ($name in @(
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "CLOUDFLARE_R2_BUCKET"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "The release environment is missing $name."
            }
          }
          & .\scripts\publish-store-installer.ps1 `
            -Version $env:RELEASE_VERSION `
            -AssetsDir $env:RELEASE_ASSETS_DIR `
            -BucketName $env:CLOUDFLARE_R2_BUCKET

      - name: Set up Microsoft Store Developer CLI
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Configure Partner Center credentials
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        shell: pwsh
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          foreach ($name in @(
            "PARTNER_CENTER_TENANT_ID",
            "PARTNER_CENTER_SELLER_ID",
            "PARTNER_CENTER_CLIENT_ID",
            "PARTNER_CENTER_CLIENT_SECRET"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "The release environment is missing secret $name."
            }
          }
          msstore settings --enableTelemetry false
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store CLI authentication failed."
          }

      - name: Prepare Microsoft Store package update
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        shell: pwsh
        env:
          PARTNER_CENTER_PRODUCT_ID: ${{ vars.PARTNER_CENTER_PRODUCT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PARTNER_CENTER_PRODUCT_ID)) {
            throw "The release environment is missing variable PARTNER_CENTER_PRODUCT_ID."
          }
          $installerUrl = "https://downloads.ceiling.win/releases/v$env:RELEASE_VERSION/Ceiling-$env:RELEASE_VERSION-Store-Setup.exe"
          $currentPath = Join-Path $env:RUNNER_TEMP "store-package-current.json"
          $preparedPath = Join-Path $env:RUNNER_TEMP "store-package-prepared.json"
          msstore submission get $env:PARTNER_CENTER_PRODUCT_ID > $currentPath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not retrieve Ceiling's current Microsoft Store package."
          }
          & .\scripts\prepare-store-submission.ps1 `
            -CurrentPackagePath $currentPath `
            -InstallerUrl $installerUrl `
            -OutputPath $preparedPath
          "STORE_INSTALLER_URL=$installerUrl" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "STORE_PACKAGE_PATH=$preparedPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Submit update to Microsoft Store
        if: vars.MICROSOFT_STORE_SUBMISSION_ENABLED == 'true'
        shell: pwsh
        env:
          PARTNER_CENTER_PRODUCT_ID: ${{ vars.PARTNER_CENTER_PRODUCT_ID }}
        run: |
          # The Store allows one active submission per product, so a release
          # tagged while the previous one is still certifying cannot submit. That
          # is a queueing conflict, not a broken release: the binaries, the
          # GitHub release, and the R2 upload are all already done and correct.
          # Skip the Store step and report it instead of failing the whole run.
          $blocked = 'One Active Submission In-Progress'

          function Skip-StoreSubmission {
            "### Microsoft Store submission skipped" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "The Store already has an active submission, which allows only one at a time." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "Everything else in this release succeeded. To submit once the active" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "submission clears, run **Validate Microsoft Store submission** with" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "``publish`` checked and version ``$env:RELEASE_VERSION``. To clear it now," |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "use *Cancel review* in Partner Center (see docs/RELEASING.md)." |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            "Installer: $env:STORE_INSTALLER_URL" |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Host "::warning::Microsoft Store submission skipped - the product already has an active submission."
          }

          $package = Get-Content -LiteralPath $env:STORE_PACKAGE_PATH -Raw
          $updateOutput = msstore submission update $env:PARTNER_CENTER_PRODUCT_ID $package 2>&1 | Out-String
          Write-Host $updateOutput
          if ($LASTEXITCODE -ne 0) {
            if ($updateOutput -match $blocked) {
              Skip-StoreSubmission
              exit 0
            }
            throw "Microsoft Store package update failed."
          }

          $publishOutput = msstore submission publish $env:PARTNER_CENTER_PRODUCT_ID 2>&1 | Out-String
          Write-Host $publishOutput
          if ($LASTEXITCODE -ne 0) {
            if ($publishOutput -match $blocked) {
              Skip-StoreSubmission
              exit 0
            }
            throw "Microsoft Store submission failed."
          }

          "### Submitted Ceiling to Microsoft Store" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Installer: $env:STORE_INSTALLER_URL" |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Sign out of Azure
        if: always()
        shell: pwsh
        run: |
          az account show *> $null
          if ($LASTEXITCODE -eq 0) {
            az logout
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Azure CLI logout did not complete cleanly."
            }
          } else {
            Write-Host "Azure CLI has no active account; skipping logout."
          }
