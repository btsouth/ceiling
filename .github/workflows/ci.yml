name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.18.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml
      - run: node --test worker.test.mjs
      - run: node scripts/ci/check-tauri-version-sync.mjs
      - run: pnpm --dir apps/desktop-tauri install --frozen-lockfile
      - run: pnpm --dir apps/desktop-tauri test
      - run: pnpm --dir apps/desktop-tauri run build

  rust-shared:
    name: Rust / shared
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: ci-shared
      - run: cargo fmt --all --check
      - name: Test Store submission preparation
        shell: pwsh
        run: .\scripts\ci\test-store-submission-preparation.ps1
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

  rust-desktop:
    name: Rust / desktop
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2.9.1
        with:
          shared-key: ci-desktop
      - run: cargo test --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml --all-targets -- -D warnings

  # RUSTSEC advisories are published against versions that are already pinned in
  # Cargo.lock, so nothing here noticed RUSTSEC-2026-0285 (rustls) or
  # RUSTSEC-2026-0258 (h2) until they were found by hand, well after main had
  # shipped with them. This job fails a pull request when a vulnerability is
  # present in the lockfile, the same way the frontend job fails on a broken
  # build.
  #
  # Advisories that are informational only (unmaintained, unsound, yanked) do
  # not fail cargo audit, so the ones currently open against this graph do not
  # block: fxhash, proc-macro-error, the unic-* set, event-listener, glib and
  # rand 0.7. A real vulnerability has to be either bumped or waived with an
  # explicit --ignore next to a comment saying why, as a lockfile-only entry
  # such as an inactive optional driver would be.
  audit:
    name: Rust / advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-audit
      - run: cargo audit --file Cargo.lock

  # One stable check name for branch protection, which requires `Rust`. A job
  # that is skipped because a job it needs failed reports as skipped rather than
  # failed, so a red `Rust / shared` or `Rust / desktop` left this required check
  # looking satisfied. `if: always()` makes it run either way, and the step below
  # turns any non-success result from any of them into a failure.
  rust:
    name: Rust
    needs: [rust-shared, rust-desktop, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Rust job succeeded
        env:
          SHARED: ${{ needs.rust-shared.result }}
          DESKTOP: ${{ needs.rust-desktop.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "rust-shared=$SHARED rust-desktop=$DESKTOP audit=$AUDIT"
          for result in "$SHARED" "$DESKTOP" "$AUDIT"; do
            if [ "$result" != "success" ]; then
              echo "::error::a required Rust job did not succeed, see the values above"
              exit 1
            fi
          done
