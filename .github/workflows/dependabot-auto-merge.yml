name: Dependabot auto-merge

# Patch and minor package updates merge on their own once the required checks pass.
# Majors and GitHub Actions updates wait for a person, because actions run inside the
# workflows that hold the signing keys. Merges made with this token do not start
# push workflows, so main's CI and caches catch up on the next merge or schedule.
on: pull_request

permissions:
  contents: read

jobs:
  queue-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Queue the merge
        if: >-
          steps.metadata.outputs.package-ecosystem != 'github_actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
